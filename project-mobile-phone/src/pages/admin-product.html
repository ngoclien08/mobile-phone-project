<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Quản lý Sản phẩm</title>
</head>
<body>
    <div class="admin-container">
      <aside class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="#"><i class="fa fa-chart-line"></i> Trang chủ</a></li>
            <li><a href="#"><i class="fa fa-mobile-alt"></i> Sản phẩm</a></li>
            <li><a href="#"><i class="fa fa-shopping-cart"></i> Đơn hàng</a></li>
            <li><a href="#"><i class="fa fa-users"></i> Người dùng</a></li>
            <li><a href="#"><i class="fa fa-chart-bar"></i> Báo cáo</a></li>
        </ul>
      </aside>
      <main class="admin-product container">
        <h2>Quản lý Sản phẩm</h2>
        <button class="btn-add">+ Thêm sản phẩm</button>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>#SP001</td>
                    <td>iPhone 15 Pro</td>
                    <td>25,000,000 VNĐ</td>
                    <td>Còn hàng</td>
                    <td>
                        <button class="btn-edit">Sửa</button>
                        <button class="btn-delete">Xóa</button>
                    </td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>#SP002</td>
                    <td>Samsung Galaxy S24</td>
                    <td>20,000,000 VNĐ</td>
                    <td>Hết hàng</td>
                    <td>
                        <button class="btn-edit">Sửa</button>
                        <button class="btn-delete">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
      </main>
    </div>
</body>
</html>
