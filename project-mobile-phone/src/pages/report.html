<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Báo cáo</title>
</head>
<body>
    <div class="admin-container">
      <aside class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="#"><i class="fa fa-chart-line"></i> Trang chủ</a></li>
            <li><a href="#"><i class="fa fa-mobile-alt"></i> Sản phẩm</a></li>
            <li><a href="#"><i class="fa fa-shopping-cart"></i> Đơn hàng</a></li>
            <li><a href="#"><i class="fa fa-users"></i> Người dùng</a></li>
            <li><a href="#" class="active"><i class="fa fa-chart-bar"></i> Báo cáo</a></li>
        </ul>
      </aside>
      <main class="admin-report container">
        <h2>Báo cáo Doanh thu</h2>
        <table>
            <thead>
                <tr>
                    <th>Tháng</th>
                    <th>Số đơn hàng</th>
                    <th>Doanh thu</th>
                    <th>Lợi nhuận</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01/2025</td>
                    <td>120</td>
                    <td>300,000,000 VND</td>
                    <td>50,000,000 VND</td>
                </tr>
                <tr>
                    <td>02/2025</td>
                    <td>95</td>
                    <td>250,000,000 VND</td>
                    <td>40,000,000 VND</td>
                </tr>
            </tbody>
        </table>
      </main>
    </div>
</body>
</html>
