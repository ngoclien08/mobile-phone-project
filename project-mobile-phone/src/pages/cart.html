<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Giỏ Hàng</title>
</head>
<body>
   <!-- Header -->
   <header class="main-header container">
    <div class="logo">
      <a href="/"><img src="../assets/images/logothegioididong.png" alt="Logo"></a>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Bạn tìm gì...">
    </div>
    <nav class="navbar">
      <a href="/login" class="icon"><i class="fas fa-user"></i> Đăng nhập</a>
      <a href="/cart" class="icon"><i class="fas fa-shopping-cart"></i> Giỏ hàng</a>
    </nav>
  </header>

  <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Giỏ Hàng</title>
</head>
<body>
  <main class="container">
    <div class="cart">
        <h2>Giỏ Hàng</h2>

        <div class="cart-item">
            <img src="../assets/images/iphone-15-pro-max.jpg" alt="iPhone 15 Pro Max">
            <div class="item-info">
                <h3>iPhone 15 Pro Max</h3>
                <p class="price">32.990.000đ</p>
                <p>Màu: Titan Xám</p>
            </div>
            <div class="actions">
                <button class="remove-btn">Xóa</button>
                <div class="quantity-control">
                    <button class="btn minus">-</button>
                    <input type="text" value="1" readonly>
                    <button class="btn plus">+</button>
                </div>
            </div>
        </div>

        <div class="cart-item">
            <img src="../assets/images/samsung-galaxy-s24-ultra.jpg" alt="Samsung Galaxy S24 Ultra">
            <div class="item-info">
                <h3>Samsung Galaxy S24 Ultra</h3>
                <p class="price">29.990.000đ</p>
                <p>Màu: Đen Phantom</p>
            </div>
            <div class="actions">
                <button class="remove-btn">Xóa</button>
                <div class="quantity-control">
                    <button class="btn minus">-</button>
                    <input type="text" value="1" readonly>
                    <button class="btn plus">+</button>
                </div>
            </div>
        </div>

        <div class="cart-summary">
            <h3>Tạm tính (2 sản phẩm): <span>62.980.000đ</span></h3>
            <button class="checkout-btn">Tiến hành thanh toán</button>
        </div>
    </div>
  </main>
</body>
</html>
